version: '3.8'

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.18-community
    container_name: rag-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pull the model on startup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull llama3.1:8b
        wait

  # Agentic RAG Application
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-application
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # LLM Configuration
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      
      # Neo4j Configuration
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      
      # ChromaDB Configuration
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      
      # Optional: OpenAI Configuration (if switching providers)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - chroma_data:/app/chroma_db
      - ./hitl_feedback.json:/app/hitl_feedback.json
    networks:
      - rag-network
    stdin_open: true  # Enable interactive mode
    tty: true         # Allocate a pseudo-TTY
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  ollama_data:
    driver: local
  chroma_data:
    driver: local

networks:
  rag-network:
    driver: bridge
